<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Broadcasts</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f1ea;
        --ink: #1c1917;
        --muted: #57534e;
        --line: #e7e5e4;
        --card: #fff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.5 ui-sans-serif, system-ui, sans-serif;
      }

      main {
        width: min(420px, calc(100% - 32px));
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 32px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.5rem;
        letter-spacing: -0.02em;
      }

      .lede {
        margin: 0 0 24px;
        color: var(--muted);
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 0.875rem;
        font-weight: 600;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        font: inherit;
      }

      input:focus {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }

      button {
        width: 100%;
        margin-top: 12px;
        padding: 12px 14px;
        border: 0;
        border-radius: 10px;
        background: var(--ink);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        background: #000;
      }

      #status {
        min-height: 1.5em;
        margin: 16px 0 0;
        color: var(--muted);
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Broadcasts</h1>
      <p class="lede">Enter your email to try OneSignal on this site.</p>
      <form id="signup">
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          required
          placeholder="you@example.com"
        />
        <button type="submit">Subscribe</button>
      </form>
      <p id="status" role="status"></p>
    </main>

    <!--
      Replace YOUR_ONESIGNAL_APP_ID with the App ID from
      OneSignal → Settings → Keys & IDs.
      The SDK stays off until that string is a real id.
    -->
    <script>
      const ONESIGNAL_APP_ID = "YOUR_ONESIGNAL_APP_ID";
      const status = document.getElementById("status");

      if (ONESIGNAL_APP_ID !== "YOUR_ONESIGNAL_APP_ID") {
        const sdk = document.createElement("script");
        sdk.src = "https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js";
        sdk.defer = true;
        document.head.appendChild(sdk);

        window.OneSignalDeferred = window.OneSignalDeferred || [];
        window.OneSignalDeferred.push(async function (OneSignal) {
          await OneSignal.init({
            appId: ONESIGNAL_APP_ID,
          });
        });
      }

      document.getElementById("signup").addEventListener("submit", function (event) {
        event.preventDefault();
        const email = new FormData(event.currentTarget).get("email");

        if (ONESIGNAL_APP_ID === "YOUR_ONESIGNAL_APP_ID") {
          status.textContent =
            "Page is up. Replace YOUR_ONESIGNAL_APP_ID in index.html to connect OneSignal.";
          return;
        }

        window.OneSignalDeferred = window.OneSignalDeferred || [];
        window.OneSignalDeferred.push(async function (OneSignal) {
          await OneSignal.User.addEmail(String(email));
          status.textContent = "Email added in OneSignal.";
        });
      });
    </script>
  </body>
</html>
