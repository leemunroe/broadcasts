<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Broadcasts</title>
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function (OneSignal) {
        await OneSignal.init({
          appId: "YOUR_ONESIGNAL_APP_ID",
          notifyButton: {
            enable: true,
          },
        });
      });
    </script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f1ea;
        --ink: #1c1917;
        --line: #e7e5e4;
        --card: #fff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.5 ui-sans-serif, system-ui, sans-serif;
      }

      main {
        width: min(420px, calc(100% - 32px));
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 32px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 0.875rem;
        font-weight: 600;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        font: inherit;
      }

      input:focus {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }

      button {
        width: 100%;
        margin-top: 12px;
        padding: 12px 14px;
        border: 0;
        border-radius: 10px;
        background: var(--ink);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        background: #000;
      }
    </style>
  </head>
  <body>
    <main>
      <form id="signup">
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          required
          placeholder="you@example.com"
        />
        <button type="submit">Subscribe</button>
      </form>
    </main>
    <script>
      document.getElementById("signup").addEventListener("submit", function (event) {
        event.preventDefault();
        const email = new FormData(event.currentTarget).get("email");
        window.OneSignalDeferred.push(async function (OneSignal) {
          await OneSignal.User.addEmail(String(email));
        });
      });
    </script>
  </body>
</html>
